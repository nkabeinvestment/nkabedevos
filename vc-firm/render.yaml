services:
  - type: web
    name: apex-vc-python-api
    runtime: python
    buildCommand: cd backend-python && pip install -r requirements.txt
    startCommand: cd backend-python && python app.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000

  - type: web
    name: apex-vc-java-api
    runtime: java
    buildCommand: cd backend-java && mvn clean package -DskipTests
    startCommand: cd backend-java && java -jar target/apex-vc-api-1.0.0.jar
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_VERSION
        value: 17
