<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>StudyMate — Tutor &amp; Student Connect</title>
  <meta name="description" content="University tutor-student matching demo built with React — browse tutors, book sessions, and manage requests." />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    window.addEventListener("error", (e) => {
      const el = document.getElementById("root");
      if (el && !el.childNodes.length) {
        el.innerHTML = '<div style="padding:20px;font-family:sans-serif;color:#e5484d">App failed to start: <code>' + (e.message || "") + "</code></div>";
      }
    });
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
    }
    if ("caches" in window) {
      caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
