<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>StudyMate — Tutor &amp; Student Connect</title>
  <meta name="description" content="University tutor-student matching demo built with React — browse tutors, book sessions, and manage requests." />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const API = "http://localhost:3002";

    const SUBJECTS = ["Mathematics", "Physics", "Computer Science", "Chemistry", "English", "Economics"];

    const MOCK_TUTORS = [
      { id: "t1", name: "Amara Okafor", subjects: ["Mathematics", "Physics"], rate: 25, rating: 4.9, sessions: 212, avatar: "👩‍🏫", bio: "PhD in Applied Mathematics. 6+ years tutoring calculus, linear algebra, and mechanics.", slots: ["Mon 10:00", "Mon 14:00", "Wed 16:00", "Fri 11:00"] },
      { id: "t2", name: "James Mwangi", subjects: ["Computer Science", "Mathematics"], rate: 30, rating: 4.8, sessions: 156, avatar: "👨‍💻", bio: "Software engineer teaching programming, algorithms, and databases with practical examples.", slots: ["Tue 12:00", "Wed 09:00", "Thu 15:00"] },
      { id: "t3", name: "Linda Chebet", subjects: ["English", "Economics"], rate: 20, rating: 4.7, sessions: 98, avatar: "👩‍🎓", bio: "Academic writing, literature, and micro/macroeconomics tutor. Friendly and structured.", slots: ["Mon 16:00", "Thu 10:00", "Sat 09:00"] },
      { id: "t4", name: "Brian Otieno", subjects: ["Chemistry", "Physics"], rate: 22, rating: 4.6, sessions: 134, avatar: "👨‍🔬", bio: "Lab-focused chemistry and physics tutor. Past papers and exam prep specialist.", slots: ["Tue 14:00", "Fri 15:00", "Sat 11:00"] },
    ];

    function loadTutors(cb) {
      fetch(API + "/api/tutors")
        .then((r) => (r.ok ? r.json() : Promise.reject()))
        .then((t) => (Array.isArray(t) && t.length ? cb(t) : cb(MOCK_TUTORS)))
        .catch(() => cb(MOCK_TUTORS));
    }

    function readBookings() { try { return JSON.parse(localStorage.getItem("studymate_bookings")) || []; } catch { return []; } }
    function saveBookings(b) { localStorage.setItem("studymate_bookings", JSON.stringify(b)); }

    const ME = { id: "t1", name: "Amara Okafor" };

    function App() {
      const [role, setRole] = useState(() => localStorage.getItem("studymate_role") || "student");
      const [tutors, setTutors] = useState(MOCK_TUTORS);
      const [tab, setTab] = useState("discover");
      const [selected, setSelected] = useState(null);
      const [bookings, setBookings] = useState(readBookings());

      useEffect(() => { loadTutors((t) => setTutors(t)); }, []);

      function switchRole(r) {
        setRole(r);
        localStorage.setItem("studymate_role", r);
      }

      function book(tutor, slot, topic) {
        const b = {
          id: "BK-" + Date.now().toString(36).toUpperCase(),
          tutorId: tutor.id,
          tutorName: tutor.name,
          subject: tutor.subjects[0],
          slot,
          topic: topic || tutor.subjects[0] + " session",
          status: "pending",
          student: "Demo Student",
          created: new Date().toISOString(),
        };
        saveBookings([b, ...readBookings()]);
        setBookings(readBookings());
        setSelected(null);
        setTab("sessions");
      }

      function respond(b, status) {
        const next = readBookings().map((x) => (x.id === b.id ? { ...x, status } : x));
        saveBookings(next);
        setBookings(readBookings());
      }

      const requests = bookings.filter((b) => b.tutorId === ME.id && b.status === "pending");
      const mine = bookings.filter((b) => (role === "student" ? b.student === "Demo Student" : b.tutorId === ME.id));

      return (
        <div className="app">
          <header className="top">
            <div className="logo">🎓 StudyMate</div>
            <div className="role-switch">
              <button className={role === "student" ? "on" : ""} onClick={() => switchRole("student")}>Student</button>
              <button className={role === "tutor" ? "on" : ""} onClick={() => switchRole("tutor")}>Tutor</button>
            </div>
          </header>

          {role === "tutor" && <TutorBanner onSwitch={() => switchRole("student")} />}

          {tab === "discover" && (
            <Discover
              tutors={tutors}
              setSelected={setSelected}
            />
          )}

          {tab === "sessions" && role === "student" && (
            <SessionsList bookings={mine} empty="No sessions booked yet — discover a tutor and book!" />
          )}

          {tab === "sessions" && role === "tutor" && (
            <TutorDash requests={requests} mine={mine.filter((b) => b.tutorId === ME.id)} onRespond={respond} />
          )}

          <nav className="bottom">
            <button className={tab === "discover" ? "on" : ""} onClick={() => setTab("discover")}>🔎<span>{role === "tutor" ? "Requests" : "Discover"}</span></button>
            <button className={tab === "sessions" ? "on" : ""} onClick={() => setTab("sessions")}>📅<span>My Sessions</span></button>
          </nav>

          {selected && (
            <TutorModal
              tutor={selected}
              onClose={() => setSelected(null)}
              onBook={(slot, topic) => book(selected, slot, topic)}
            />
          )}
        </div>
      );
    }

    function TutorBanner({ onSwitch }) {
      return (
        <div className="banner">
          <div>
            <strong>You're a tutor 🎓</strong>
            <p>Accept requests below, or switch back to browse as a student.</p>
          </div>
        </div>
      );
    }

    function Discover({ tutors, setSelected }) {
      const [q, setQ] = useState("");
      const [subj, setSubj] = useState("All");
      const list = tutors.filter((t) => {
        const okSub = subj === "All" || t.subjects.includes(subj);
        const okQ = t.name.toLowerCase().includes(q.toLowerCase());
        return okSub && okQ;
      });

      return (
        <main className="content">
          <input className="input" placeholder="Search tutors…" value={q} onChange={(e) => setQ(e.target.value)} />
          <div className="chips">
            <button className={subj === "All" ? "chip on" : "chip"} onClick={() => setSubj("All")}>All</button>
            {SUBJECTS.map((s) => (
              <button key={s} className={subj === s ? "chip on" : "chip"} onClick={() => setSubj(s)}>{s}</button>
            ))}
          </div>

          {list.map((t) => (
            <button key={t.id} className="tutor" onClick={() => setSelected(t)}>
              <span className="t-av">{t.avatar}</span>
              <span className="t-body">
                <strong>{t.name}</strong>
                <small>{t.subjects.join(" · ")}</small>
                <small>⭐ {t.rating} · {t.sessions} sessions</small>
              </span>
              <span className="t-rate">${t.rate}<small>/hr</small></span>
            </button>
          ))}
          {!list.length && <p className="muted">No tutors match.</p>}
        </main>
      );
    }

    function TutorModal({ tutor, onClose, onBook }) {
      const [slot, setSlot] = useState("");
      const [topic, setTopic] = useState("");
      return (
        <div className="overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div className="sheet">
            <button className="sheet-x" onClick={onClose}>✕</button>
            <div className="tutor-head">
              <span className="t-av big">{tutor.avatar}</span>
              <div>
                <h3 style={{ margin: 0 }}>{tutor.name}</h3>
                <p className="muted" style={{ margin: 0 }}>⭐ {tutor.rating} · {tutor.sessions} sessions · ${tutor.rate}/hr</p>
              </div>
            </div>
            <p className="bio">{tutor.bio}</p>
            <div className="lbl">Pick a slot</div>
            <div className="chips">
              {tutor.slots.map((s) => (
                <button key={s} className={slot === s ? "chip on" : "chip"} onClick={() => setSlot(s)}>{s}</button>
              ))}
            </div>
            <div className="lbl" style={{ marginTop: 12 }}>Topic / notes</div>
            <input className="input" placeholder="e.g. Calculus II — derivatives review" value={topic} onChange={(e) => setTopic(e.target.value)} />
            <button className="cta" disabled={!slot} onClick={() => onBook(slot, topic)}>
              {slot ? "Book session" : "Select a slot"}
            </button>
          </div>
        </div>
      );
    }

    function SessionsList({ bookings, empty }) {
      return (
        <main className="content">
          <h2 className="page-title">My Sessions</h2>
          {!bookings.length && <p className="muted">{empty}</p>}
          {bookings.map((b) => (
            <div key={b.id} className="trip">
              <span className="trip-icon">🎓</span>
              <span className="trip-body">
                <strong>{b.tutorName}</strong>
                <small>{b.topic}</small>
                <small>{b.slot} · {b.id}</small>
              </span>
              <span className={b.status === "confirmed" ? "st ok" : b.status === "declined" ? "st no" : "st"}>{b.status}</span>
            </div>
          ))}
        </main>
      );
    }

    function TutorDash({ requests, mine, onRespond }) {
      return (
        <main className="content">
          <h2 className="page-title">Booking Requests</h2>
          {!requests.length && <p className="muted">No pending requests. Book as a student to create one for yourself.</p>}
          {requests.map((b) => (
            <div key={b.id} className="trip">
              <span className="trip-icon">🙋</span>
              <span className="trip-body">
                <strong>{b.student}</strong>
                <small>{b.topic}</small>
                <small>{b.slot}</small>
              </span>
              <span className="req-actions">
                <button className="mini-ok" onClick={() => onRespond(b, "confirmed")}>✓</button>
                <button className="mini-no" onClick={() => onRespond(b, "declined")}>✕</button>
              </span>
            </div>
          ))}

          <h2 className="page-title">Confirmed Sessions</h2>
          {!mine.some((b) => b.status === "confirmed") && <p className="muted">No confirmed sessions yet.</p>}
          {mine.filter((b) => b.status !== "pending").map((b) => (
            <div key={b.id} className="trip">
              <span className="trip-icon">📅</span>
              <span className="trip-body">
                <strong>{b.student}</strong>
                <small>{b.topic}</small>
                <small>{b.slot}</small>
              </span>
              <span className={b.status === "confirmed" ? "st ok" : "st no"}>{b.status}</span>
            </div>
          ))}
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    window.addEventListener("error", (e) => {
      const el = document.getElementById("root");
      if (el && !el.childNodes.length) {
        el.innerHTML = '<div style="padding:20px;font-family:sans-serif;color:#e5484d">App failed to start: <code>' + (e.message || "") + "</code></div>";
      }
    });
  </script>
</body>
</html>
